global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:admin123

frontend http_front
    bind *:8080
    default_backend http_back

backend http_back
    balance roundrobin
    server app1 app1:80 check
    server app2 app2:80 check
