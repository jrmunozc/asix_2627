global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend http_front
    bind *:80
    default_backend web_apps

backend web_apps
    balance roundrobin
    server app1 app1:80 check
    server app2 app2:80 check

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 3s
